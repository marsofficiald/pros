<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>картка предмета</title>
    <link rel="stylesheet" href="pros.css">
</head>
<body>

<div class="item-card item-card--legendary">

    <img class="item-card__image" src="images (1).jpg" alt="Меч">

    <div class="item-card__content">
        <h1 class="item-card__title">Меч дракона</h1>

        <p class="item-card__type">Тип: меч</p>

        <p class="item-card__description">
             меч створений із металу дракона
            дає велику силу в бою.
        </p>

        <p class="item-card__rarity">рідкість: легендарний</p>

        <p class="item-card__price">2500 золота</p>

        <button class="item-card__button">придбати</button>
    </div>

</div>

</body>
